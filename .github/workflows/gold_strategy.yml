name: Run Gold Strategy

on:
  schedule:
    # Запуск каждые 4 часа начиная с 03:01 МСК (00:01 UTC)
    - cron: '1 0,4,8,12,16,20 * * *'
  workflow_dispatch:

jobs:
  run-strategy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install t-tech-investments --index-url https://opensource.tbank.ru/api/v4/projects/238/packages/pypi/simple
          pip install pandas numpy requests

      - name: Run strategy
        env:
          T_SANDAPI: ${{ secrets.T_SANDAPI }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -m src.main
